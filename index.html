<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de Asistencia</title>
<meta name="theme-color" content="#142433">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
  --ink:#142433; --ink-2:#1f3245; --ink-3:#2a3f56;
  --paper:#F1F3EF; --card:#FFFFFF; --line:#DDE2DB;
  --text:#17242B; --text-soft:#5C6B70; --text-faint:#8B979B;
  --safety:#FF6A1A; --safety-ink:#7A2E00; --safety-soft:#FFE9DC;
  --teal:#146B5C; --teal-soft:#DEF0EA;
  --danger:#C1442E; --danger-soft:#FBEAE6;
  --warn:#9A6B00; --warn-soft:#FBF0D6;
  --radius:16px; --radius-sm:10px;
  --shadow:0 1px 2px rgba(20,36,51,.06), 0 8px 24px -12px rgba(20,36,51,.18);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--text);
  font-family:'Manrope',system-ui,-apple-system,sans-serif;
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
button,input,select,textarea{font-family:inherit; font-size:inherit; color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
.numeric{font-variant-numeric:tabular-nums}

#app{display:flex; flex-direction:column; min-height:100dvh}

/* ---------- Topbar ---------- */
.topbar{
  background:var(--ink); color:#fff;
  padding:calc(env(safe-area-inset-top) + 14px) 16px 14px;
  display:flex; align-items:center; gap:10px;
  position:sticky; top:0; z-index:20;
}
.topbar .brand{display:flex; align-items:center; gap:10px; flex:1; min-width:0}
.topbar .mark{
  width:34px; height:34px; border-radius:10px; background:var(--safety);
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.topbar .titles{min-width:0}
.topbar h1{font-size:15px; font-weight:700; letter-spacing:.1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.topbar .sync{font-size:11.5px; color:#B9C6CE; display:flex; align-items:center; gap:5px; margin-top:1px}
.sync .dot{width:6px; height:6px; border-radius:50%; background:#5FD1A5; flex-shrink:0}
.sync.offline .dot{background:#E8A24B}
.iconbtn{
  width:38px; height:38px; border-radius:10px; border:none; background:rgba(255,255,255,.08);
  color:#fff; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
.iconbtn:active{background:rgba(255,255,255,.18)}

/* ---------- Main / layout ---------- */
main{flex:1; padding:16px 16px calc(96px + env(safe-area-inset-bottom))}
.screen{max-width:560px; margin:0 auto}
.section-title{font-size:13px; font-weight:700; color:var(--text-soft); margin:22px 2px 10px; letter-spacing:.1px}
.section-title:first-child{margin-top:2px}

/* ---------- Tabbar ---------- */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:20;
  background:#fff; border-top:1px solid var(--line);
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  display:flex; justify-content:space-around; gap:2px;
}
.tab{
  border:none; background:none; display:flex; flex-direction:column; align-items:center; gap:3px;
  color:var(--text-faint); padding:6px 10px; border-radius:12px; flex:1; max-width:110px;
}
.tab.active{color:var(--safety)}
.tab span{font-size:11px; font-weight:600}

/* ---------- Cards & controls ---------- */
.card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
.field{display:block; margin-bottom:14px}
.field:last-child{margin-bottom:0}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--text-soft); margin-bottom:6px}
.field .hint{font-size:12px; color:var(--text-faint); margin-top:5px}
.field .hint.error{color:var(--danger); font-weight:600}
.field .hint.ok{color:var(--teal); font-weight:600}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=password],input[type=url],select,textarea{
  width:100%; padding:12px 13px; border:1.5px solid var(--line); border-radius:var(--radius-sm);
  background:#fff; color:var(--text); outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--ink-3)}
input[disabled]{background:#F5F6F4; color:var(--text-faint)}
.checkrow{display:flex; align-items:center; gap:10px; padding:2px 0}
.checkrow input{width:18px; height:18px}
.checkrow label{font-size:13.5px; font-weight:600; color:var(--text)}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}

.btn{
  border:none; border-radius:var(--radius-sm); padding:13px 18px; font-weight:700; font-size:14.5px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px; width:100%;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--safety); color:#fff}
.btn-teal{background:var(--teal); color:#fff}
.btn-outline{background:#fff; border:1.5px solid var(--line); color:var(--text)}
.btn-ghost{background:transparent; color:var(--ink-3); font-weight:700}
.btn-danger-ghost{background:var(--danger-soft); color:var(--danger)}
.btn-sm{padding:9px 14px; font-size:13px; width:auto}
.btn[disabled]{opacity:.5}

.badge{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:4px 9px; border-radius:99px}
.badge-ok{background:var(--teal-soft); color:var(--teal)}
.badge-off{background:#EEF0EC; color:var(--text-faint)}
.badge-warn{background:var(--warn-soft); color:var(--warn)}
.badge-danger{background:var(--danger-soft); color:var(--danger)}

.list-row{
  display:flex; align-items:center; gap:12px; padding:13px 4px; border-bottom:1px solid var(--line);
}
.list-row:last-child{border-bottom:none}
.list-row .avatar{
  width:38px; height:38px; border-radius:10px; background:var(--ink); color:#fff;
  display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; flex-shrink:0;
}
.list-row .info{flex:1; min-width:0}
.list-row .info .name{font-weight:700; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.list-row .info .meta{font-size:12.5px; color:var(--text-soft); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

.empty{text-align:center; padding:40px 20px; color:var(--text-soft)}
.empty .icn{color:var(--text-faint); margin-bottom:10px}
.empty h3{font-size:15px; margin-bottom:5px; color:var(--text)}
.empty p{font-size:13px; line-height:1.5}

.search-wrap{position:relative}
.search-wrap svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--text-faint)}
.search-wrap input{padding-left:38px}

.chip-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; margin:-2px -2px 2px; -webkit-overflow-scrolling:touch}
.chip-row::-webkit-scrollbar{display:none}
.chip{
  flex-shrink:0; border:1.5px solid var(--line); background:#fff; color:var(--text-soft);
  padding:8px 14px; border-radius:99px; font-size:13px; font-weight:700; white-space:nowrap;
}
.chip.active{background:var(--ink); border-color:var(--ink); color:#fff}

/* ---------- Marcar screen ---------- */
.status-card{border-radius:var(--radius); padding:20px; color:#fff; background:var(--ink); box-shadow:var(--shadow)}
.status-card .who{font-size:17px; font-weight:800}
.status-card .cargo{font-size:12.5px; color:#B9C6CE; margin-top:2px}
.status-card .state-line{display:flex; align-items:center; gap:8px; margin-top:14px; font-size:13.5px; font-weight:600}
.status-card .state-dot{width:8px; height:8px; border-radius:50%}
.geo-readout{margin-top:14px; padding-top:14px; border-top:1px solid rgba(255,255,255,.14); font-size:12.5px; color:#B9C6CE; display:flex; justify-content:space-between; gap:10px}
.geo-readout b{color:#fff; font-size:13.5px}

.big-action{margin-top:14px}
.big-action .btn{padding:18px; font-size:16px; border-radius:var(--radius)}

.picker-btn{
  width:100%; text-align:left; background:#fff; border:1.5px solid var(--line); border-radius:var(--radius-sm);
  padding:13px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.picker-btn .lbl{font-size:11.5px; font-weight:700; color:var(--text-faint); text-transform:none}
.picker-btn .val{font-size:14.5px; font-weight:700; margin-top:2px}
.picker-btn .val.placeholder{color:var(--text-faint); font-weight:600}

/* ---------- Modal / sheet ---------- */
.overlay{position:fixed; inset:0; background:rgba(20,36,51,.45); z-index:40; display:flex; align-items:flex-end; justify-content:center}
.sheet{
  width:100%; max-width:560px; background:#fff; border-radius:20px 20px 0 0;
  max-height:92dvh; overflow-y:auto; padding:18px 18px calc(22px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 30px rgba(0,0,0,.2);
}
.sheet .handle{width:36px; height:4px; background:var(--line); border-radius:99px; margin:0 auto 14px}
.sheet-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:16px}
.sheet-head h2{font-size:17px; font-weight:800}
.sheet-head p{font-size:12.5px; color:var(--text-soft); margin-top:3px; line-height:1.4}
.sheet-close{width:32px; height:32px; border-radius:9px; border:none; background:#F1F3EF; color:var(--text-soft); flex-shrink:0; display:flex; align-items:center; justify-content:center}
.sheet-actions{display:flex; gap:10px; margin-top:18px}

/* ---------- Toasts ---------- */
#toast-root{position:fixed; left:0; right:0; bottom:calc(84px + env(safe-area-inset-bottom)); z-index:60; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; padding:0 16px}
.toast{
  max-width:480px; width:100%; background:var(--ink); color:#fff; padding:13px 16px; border-radius:12px;
  font-size:13.5px; font-weight:600; box-shadow:0 8px 24px rgba(0,0,0,.25); display:flex; align-items:center; gap:10px;
}
.toast.error{background:var(--danger)}
.toast.ok{background:var(--teal)}

/* ---------- Welcome ---------- */
.welcome{padding-top:20px}
.welcome .hero{width:56px; height:56px; border-radius:16px; background:var(--safety); display:flex; align-items:center; justify-content:center; margin-bottom:18px}
.welcome h2{font-size:21px; font-weight:800; line-height:1.25}
.welcome p{color:var(--text-soft); font-size:14px; line-height:1.55; margin-top:10px}
.steplist{margin-top:18px; display:flex; flex-direction:column; gap:10px}
.stepitem{display:flex; gap:12px; align-items:flex-start}
.stepitem .n{width:24px; height:24px; border-radius:7px; background:var(--ink); color:#fff; font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px}
.stepitem p{font-size:13.5px; color:var(--text); margin:0}

.spinner{width:16px; height:16px; border-radius:50%; border:2px solid rgba(255,255,255,.35); border-top-color:#fff; animation:spin .7s linear infinite}
.spinner.dark{border:2px solid rgba(20,36,51,.2); border-top-color:var(--ink)}
@keyframes spin{to{transform:rotate(360deg)}}

.table-wrap{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); background:#fff}
table{width:100%; border-collapse:collapse; font-size:12.5px; min-width:640px}
th{text-align:left; padding:10px 12px; font-size:11px; font-weight:800; color:var(--text-soft); background:#F7F8F6; border-bottom:1px solid var(--line); white-space:nowrap}
td{padding:10px 12px; border-bottom:1px solid var(--line); white-space:nowrap}
tr:last-child td{border-bottom:none}

.helper-banner{display:flex; gap:10px; align-items:flex-start; background:var(--warn-soft); color:var(--warn); border-radius:var(--radius-sm); padding:12px 13px; font-size:12.5px; font-weight:600; line-height:1.4; margin-bottom:14px}
.helper-banner.danger{background:var(--danger-soft); color:var(--danger)}
.helper-banner svg{flex-shrink:0; margin-top:1px}

@media (min-width:640px){
  main{padding-left:24px; padding-right:24px}
}
</style>
</head>

/* ==================================================================
   RUT CHILENO (mismo algoritmo que el backend)
   ================================================================== */
function limpiaRut(rut){ return String(rut||'').replace(/[.\s]/g,'').replace('-','').toUpperCase(); }
function calculaDV(cuerpo){
  var suma=0, mult=2;
  for(var i=cuerpo.length-1;i>=0;i--){ suma+=parseInt(cuerpo.charAt(i),10)*mult; mult = mult===7?2:mult+1; }
  var resto = 11-(suma%11);
  if(resto===11) return '0';
  if(resto===10) return 'K';
  return String(resto);
}
function validaRut(rut){
  var limpio = limpiaRut(rut);
  if(!/^\d{7,8}[0-9K]$/.test(limpio)) return false;
  return calculaDV(limpio.slice(0,-1)) === limpio.slice(-1);
}
function formateaRut(rut){
  var limpio = limpiaRut(rut);
  if(limpio.length<2) return limpio;
  var cuerpo = limpio.slice(0,-1), dv = limpio.slice(-1);
  return cuerpo.replace(/\B(?=(\d{3})+(?!\d))/g,'.') + '-' + dv;
}

/* ==================================================================
   GEO
   ================================================================== */
function distanciaMetros(lat1,lng1,lat2,lng2){
  var rad=Math.PI/180, dLat=(lat2-lat1)*rad, dLng=(lng2-lng1)*rad;
  var a = Math.sin(dLat/2)*Math.sin(dLat/2) + Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLng/2)*Math.sin(dLng/2);
  return 6371000*2*Math.atan2(Math.sqrt(a), Math.sqrt(Math.max(0,1-a)));
}
function obtenerUbicacion(){
  return new Promise(function(resolve,reject){
    if(!navigator.geolocation){ reject(new Error('Este navegador no soporta ubicación GPS.')); return; }
    navigator.geolocation.getCurrentPosition(
      function(pos){ resolve({lat:pos.coords.latitude, lng:pos.coords.longitude, accuracy:pos.coords.accuracy, timestamp:pos.timestamp || Date.now()}); },
      function(err){
        var msgs = {1:'Permiso de ubicación denegado. Actívalo en los ajustes del navegador.', 2:'No se pudo determinar tu ubicación.', 3:'Se agotó el tiempo esperando el GPS. Intenta de nuevo al aire libre.'};
        reject(new Error(msgs[err.code] || 'No se pudo obtener tu ubicación.'));
      },
      {enableHighAccuracy:true, timeout:15000, maximumAge:0}
    );
  });
}

/* ==================================================================
   FORMATO
   ================================================================== */
function fmtFechaHora(iso){
  if(!iso) return '';
  try{
    return new Date(iso).toLocaleString('es-CL',{timeZone:'America/Santiago', day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
  }catch(e){ return iso; }
}
function fmtHora(iso){
  if(!iso) return '';
  try{ return new Date(iso).toLocaleTimeString('es-CL',{timeZone:'America/Santiago', hour:'2-digit', minute:'2-digit'}); }catch(e){ return iso; }
}
function fmtFecha(iso){
  if(!iso) return '';
  try{ return new Date(iso).toLocaleDateString('es-CL',{timeZone:'America/Santiago', day:'2-digit', month:'2-digit', year:'numeric'}); }catch(e){ return iso; }
}
function iniciales(nombre){
  var partes = String(nombre||'').trim().split(/\s+/);
  return ((partes[0]||'')[0]||'') + ((partes[1]||'')[0]||'');
}
function esc(s){
  return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; });
}
</script>
<script>
'use strict';

/* ==================================================================
   ALMACENAMIENTO LOCAL (config + caché de lectura)
   ================================================================== */
var CFG_KEY = 'ctrl-asistencia:config:v1';
var CACHE_KEY = 'ctrl-asistencia:cache:v1';
var LAST_KEY = 'ctrl-asistencia:ultimos:v1';

function cargarConfig(){
  try{ return Object.assign({url:'', pin:''}, JSON.parse(localStorage.getItem(CFG_KEY)||'{}')); }
  catch(e){ return {url:'', pin:''}; }
}
function guardarConfig(cfg){ try{ localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); }catch(e){} }
function cargarCache(){ try{ return JSON.parse(localStorage.getItem(CACHE_KEY)||'null'); }catch(e){ return null; } }
function guardarCache(){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify({facilities:state.facilities, people:state.people, shifts:state.shifts, ts:Date.now()})); }catch(e){}
}
function cargarUltimos(){ try{ return JSON.parse(localStorage.getItem(LAST_KEY)||'{}'); }catch(e){ return {}; } }
function guardarUltimos(obj){
  try{ localStorage.setItem(LAST_KEY, JSON.stringify(Object.assign(cargarUltimos(), obj))); }catch(e){}
}

/* ==================================================================
   ESTADO GLOBAL
   ================================================================== */
var state = {
  config: cargarConfig(),
  facilities: [], people: [], shifts: [],
  loading: false, syncing: false, online: navigator.onLine, lastSync: null, lastError: '',
  ui: {
    tab: 'marcar',
    facilityId: '', personId: '', busqueda: '',
    geo: null, geoError: '', marcando: false,
    personalFiltro: '', personalInstalacion: '',
    historialInstalacion: '', historialDesde: '', historialHasta: '',
    adminExpandido: null
  }
};

(function initUltimos(){
  var u = cargarUltimos();
  if(u.facilityId) state.ui.facilityId = u.facilityId;
  if(u.personId) state.ui.personId = u.personId;
  var hoy = new Date().toISOString().slice(0,10);
  state.ui.historialDesde = hoy;
  state.ui.historialHasta = hoy;
})();

(function initCache(){
  var c = cargarCache();
  if(c){
    state.facilities = c.facilities||[];
    state.people = c.people||[];
    state.shifts = c.shifts||[];
    state.lastSync = c.ts||null;
  }
})();

/* ==================================================================
   CAPA DE API (Google Apps Script como backend)
   ================================================================== */
function tieneBackend(){ return !!(state.config.url && /^https?:\/\//.test(state.config.url)); }

function apiGet(){
  var url = state.config.url + (state.config.url.indexOf('?')>-1?'&':'?') + 't=' + Date.now();
  return fetch(url).then(function(res){ return res.json(); }).then(function(data){
    if(!data.ok) throw new Error(data.error || 'No se pudo cargar la información.');
    return data;
  });
}
function apiPost(body){
  var payload = Object.assign({}, body);
  if(state.config.pin) payload.pin = state.config.pin;
  return fetch(state.config.url, {method:'POST', body: JSON.stringify(payload)})
    .then(function(res){ return res.json(); })
    .then(function(data){
      if(!data.ok) throw new Error(data.error || 'Ocurrió un error.');
      return data.result;
    });
}

function sincronizar(mostrarError){
  if(!tieneBackend()) return Promise.resolve();
  state.syncing = true; renderTopbar();
  return apiGet().then(function(data){
    state.facilities = data.facilities||[];
    state.people = data.people||[];
    state.shifts = data.shifts||[];
    state.online = true; state.lastSync = Date.now(); state.lastError = '';
    guardarCache();
  }).catch(function(err){
    state.online = false; state.lastError = err.message;
    if(mostrarError) toast(err.message, 'error');
  }).finally(function(){
    state.syncing = false; renderTopbar();
  });
}

/* ==================================================================
   TOASTS
   ================================================================== */
function toast(msg, tipo){
  var root = document.getElementById('toast-root');
  var el = document.createElement('div');
  el.className = 'toast' + (tipo==='error'?' error':tipo==='ok'?' ok':'');
  el.innerHTML = (tipo==='error'?ICON.warn:tipo==='ok'?ICON.check:'') + '<span>'+esc(msg)+'</span>';
  root.appendChild(el);
  setTimeout(function(){ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(function(){ el.remove(); }, 300); }, 3600);
}
</script>
<script>
'use strict';

/* ==================================================================
   ACCESO A DATOS (derivados del estado)
   ================================================================== */
function instalacionesActivas(){ return state.facilities.filter(function(f){ return Number(f.activa)!==0; }); }
function personaPorId(id){ return state.people.filter(function(p){ return p.id===id; })[0] || null; }
function instalacionPorId(id){ return state.facilities.filter(function(f){ return f.id===id; })[0] || null; }
function personalDeInstalacion(facilityId, soloActivos){
  return state.people.filter(function(p){
    return p.instalacionId===facilityId && (!soloActivos || Number(p.activo)===1);
  }).sort(function(a,b){ return String(a.nombre).localeCompare(String(b.nombre),'es'); });
}
function turnoAbiertoDe(personId){
  var abiertos = state.shifts.filter(function(s){ return s.personId===personId && !s.salida; });
  abiertos.sort(function(a,b){ return new Date(b.entrada)-new Date(a.entrada); });
  return abiertos[0] || null;
}
function nombreInstalacion(id){ var f=instalacionPorId(id); return f ? f.nombre : '(instalación eliminada)'; }
function nombrePersona(id){ var p=personaPorId(id); return p ? p.nombre : '(persona eliminada)'; }

/* ==================================================================
   NAVEGACIÓN
   ================================================================== */
function cambiarTab(tab){
  state.ui.tab = tab;
  renderApp();
  if(tieneBackend()) sincronizar(false);
}
</script>
<script>
'use strict';

/* ==================================================================
   RENDER: RAÍZ, TOPBAR, TABBAR
   ================================================================== */
function renderApp(){
  var app = document.getElementById('app');
  app.innerHTML =
    '<header class="topbar" id="topbar"></header>' +
    '<main id="main"></main>' +
    (tieneBackend() ? tabbarHTML() : '');
  renderTopbar();
  renderMain();
}

function tabbarHTML(){
  var tabs = [
    {id:'marcar', label:'Marcar', icon:ICON.checkCircle},
    {id:'personal', label:'Personal', icon:ICON.users},
    {id:'instalaciones', label:'Instalaciones', icon:ICON.building},
    {id:'historial', label:'Historial', icon:ICON.history}
  ];
  return '<nav class="tabbar">' + tabs.map(function(t){
    return '<button class="tab' + (state.ui.tab===t.id?' active':'') + '" data-action="tab" data-tab="'+t.id+'">' + t.icon + '<span>'+t.label+'</span></button>';
  }).join('') + '</nav>';
}

function renderTopbar(){
  var el = document.getElementById('topbar');
  if(!el) return;
  var syncTxt = !tieneBackend() ? 'Sin configurar' :
    state.syncing ? 'Sincronizando…' :
    state.online ? 'Sincronizado' :
    'Sin conexión — datos guardados';
  el.innerHTML =
    '<div class="brand">' +
      '<div class="mark">' + ICON.checkCircle.replace('width="22" height="22"','width="19" height="19"').replace('currentColor','#fff') + '</div>' +
      '<div class="titles">' +
        '<h1>Control de Asistencia</h1>' +
        '<div class="sync' + (state.online?'':' offline') + '">' +
          (state.syncing ? '<span class="spinner" style="width:10px;height:10px;border-width:1.5px"></span>' : '<span class="dot"></span>') +
          '<span>'+syncTxt+'</span>' +
        '</div>' +
      '</div>' +
    '</div>' +
    (tieneBackend() ? '<button class="iconbtn" data-action="refrescar" aria-label="Actualizar">'+ICON.refresh+'</button>' : '') +
    '<button class="iconbtn" data-action="config" aria-label="Configuración">'+ICON.gear+'</button>';
}

function renderMain(){
  var main = document.getElementById('main');
  if(!tieneBackend()){ main.innerHTML = pantallaBienvenida(); return; }
  var html;
  switch(state.ui.tab){
    case 'personal': html = pantallaPersonal(); break;
    case 'instalaciones': html = pantallaInstalaciones(); break;
    case 'historial': html = pantallaHistorial(); break;
    default: html = pantallaMarcar();
  }
  main.innerHTML = '<div class="screen">' + html + '</div>';
}

/* ==================================================================
   MODALES (hoja inferior)
   ================================================================== */
function abrirSheet(html){
  var root = document.getElementById('modal-root');
  root.innerHTML = '<div class="overlay">' +
    '<div class="sheet">' +
      '<div class="handle"></div>' +
      html +
    '</div>' +
  '</div>';
}
function cerrarModal(){ document.getElementById('modal-root').innerHTML = ''; }

function abrirConfirmacion(titulo, mensaje, textoBoton, accion){
  window.__confirmAccion = accion;
  abrirSheet(
    '<div class="sheet-head"><div><h2>'+esc(titulo)+'</h2><p>'+esc(mensaje)+'</p></div>' +
      '<button class="sheet-close" data-action="cerrar-modal">'+ICON.x+'</button></div>' +
    '<div class="sheet-actions">' +
      '<button class="btn btn-outline" data-action="cerrar-modal">Cancelar</button>' +
      '<button class="btn btn-danger-ghost" data-action="confirmar-accion">'+esc(textoBoton)+'</button>' +
    '</div>'
  );
}
</script>

<script>
'use strict';

/* ==================================================================
   PANTALLA: MARCAR (entrada / salida)
   ================================================================== */
function pantallaMarcar(){
  var facilities = instalacionesActivas().slice().sort(function(a,b){ return String(a.nombre).localeCompare(String(b.nombre),'es'); });
  if(!facilities.length) return pantallaVaciaSinInstalaciones();

  if(!state.ui.facilityId || !instalacionPorId(state.ui.facilityId)) state.ui.facilityId = facilities[0].id;
  var personas = personalDeInstalacion(state.ui.facilityId, true);
  if(state.ui.personId && !personas.some(function(p){ return p.id===state.ui.personId; })) state.ui.personId = '';

  var persona = state.ui.personId ? personaPorId(state.ui.personId) : null;
  var instalacion = instalacionPorId(state.ui.facilityId);
  var turno = persona ? turnoAbiertoDe(persona.id) : null;

  var html = '';
  html += '<div class="field"><label>Instalación</label>' +
    '<select data-action="cambiar-instalacion">' +
      facilities.map(function(f){ return '<option value="'+f.id+'"'+(f.id===state.ui.facilityId?' selected':'')+'>'+esc(f.nombre)+'</option>'; }).join('') +
    '</select></div>';

  html += '<div class="field"><label>Persona &middot; ' + personas.length + ' activas</label>' +
    (personas.length
      ? '<select data-action="cambiar-persona"><option value="">Selecciona tu nombre&hellip;</option>' +
          personas.map(function(p){ return '<option value="'+p.id+'"'+(p.id===state.ui.personId?' selected':'')+'>'+esc(p.nombre)+' &middot; '+esc(p.rut)+'</option>'; }).join('') +
        '</select>'
      : '<div class="helper-banner">'+ICON.warn+'<span>No hay personal activo en esta instalación. Agrégalo desde la pestaña Personal.</span></div>'
    ) +
  '</div>';

  if(persona){
    var dentro = !!turno;
    html += '<div class="status-card">' +
      '<div class="who">'+esc(persona.nombre)+'</div>' +
      '<div class="cargo">'+esc(persona.cargo||'Sin cargo asignado')+' &middot; '+esc(instalacion.nombre)+'</div>' +
      '<div class="state-line"><span class="state-dot" style="background:'+(dentro?'#5FD1A5':'#8B979B')+'"></span>' +
        (dentro ? 'Turno abierto desde las '+fmtHora(turno.entrada) : 'Fuera de turno') +
      '</div>' +
    '</div>';

    if(Number(instalacion.geocercada)===1 && (instalacion.lat==='' || instalacion.lng==='')){
      html += '<div class="helper-banner" style="margin-top:12px">'+ICON.warn+'<span>Esta instalación todavía no tiene ubicación GPS configurada — nadie podrá marcar aquí hasta que un administrador la configure en la pestaña Instalaciones.</span></div>';
    }

    html += '<div class="big-action">' +
      (dentro
        ? '<button class="btn btn-teal" data-action="marcar-salida" '+(state.ui.marcando?'disabled':'')+'>' + (state.ui.marcando?'<span class="spinner"></span> Obteniendo ubicaci&oacute;n&hellip;':ICON.check.replace('currentColor','#fff')+' Marcar salida') + '</button>'
        : '<button class="btn btn-primary" data-action="marcar-entrada" '+(state.ui.marcando?'disabled':'')+'>' + (state.ui.marcando?'<span class="spinner"></span> Obteniendo ubicaci&oacute;n&hellip;':ICON.checkCircle.replace('currentColor','#fff')+' Marcar entrada') + '</button>'
      ) +
      '<p style="text-align:center; font-size:11.5px; color:var(--text-faint); margin-top:9px">Se solicitar&aacute; tu ubicaci&oacute;n GPS al presionar el bot&oacute;n.</p>' +
    '</div>';
  } else {
    html += '<div class="empty">' + ICON.users.replace('width="22" height="22"','width="30" height="30"') + '<h3>Elige tu nombre</h3><p>Selecciona tu instalaci&oacute;n y tu nombre en la lista para poder marcar entrada o salida.</p></div>';
  }

  return html;
}

function pantallaVaciaSinInstalaciones(){
  return '<div class="empty">' + ICON.building.replace('width="22" height="22"','width="34" height="34"') +
    '<h3>Todav&iacute;a no hay instalaciones</h3>' +
    '<p>Agrega tu primera instalaci&oacute;n o importa tu n&oacute;mina desde la pesta&ntilde;a Personal.</p>' +
    '<div style="margin-top:16px"><button class="btn btn-primary" data-action="tab" data-tab="instalaciones">Ir a Instalaciones</button></div>' +
  '</div>';
}
</script>
<script>
'use strict';

/* ==================================================================
   PANTALLA: PERSONAL
   ================================================================== */
function pantallaPersonal(){
  var instalaciones = state.facilities.slice().sort(function(a,b){ return String(a.nombre).localeCompare(String(b.nombre),'es'); });
  var filtro = state.ui.personalFiltro.trim().toLowerCase();
  var instId = state.ui.personalInstalacion;

  var personas = state.people.filter(function(p){
    if(instId && p.instalacionId!==instId) return false;
    if(filtro){
      var hay = (p.nombre+' '+p.rut+' '+(p.cargo||'')).toLowerCase();
      if(hay.indexOf(filtro)===-1) return false;
    }
    return true;
  }).sort(function(a,b){
    if(Number(a.activo)!==Number(b.activo)) return Number(b.activo)-Number(a.activo);
    return String(a.nombre).localeCompare(String(b.nombre),'es');
  });

  var html = '';
  html += '<div class="row2" style="margin-bottom:12px">' +
    '<button class="btn btn-primary btn-sm" data-action="abrir-agregar-persona">'+ICON.plus.replace('currentColor','#fff')+' Agregar</button>' +
    '<button class="btn btn-outline btn-sm" data-action="abrir-importar">'+ICON.upload+' Importar Excel</button>' +
  '</div>';

  html += '<div class="search-wrap" style="margin-bottom:10px">' + ICON.search + '<input type="search" placeholder="Buscar por nombre o RUT" value="'+esc(state.ui.personalFiltro)+'" data-action="buscar-personal"></div>';

  if(instalaciones.length){
    html += '<div class="chip-row" style="margin-bottom:14px">' +
      '<button class="chip'+(!instId?' active':'')+'" data-action="filtrar-instalacion-personal" data-id="">Todas</button>' +
      instalaciones.map(function(f){ return '<button class="chip'+(instId===f.id?' active':'')+'" data-action="filtrar-instalacion-personal" data-id="'+f.id+'">'+esc(f.nombre)+'</button>'; }).join('') +
    '</div>';
  }

  if(!personas.length){
    html += '<div class="empty">'+ICON.users.replace('width="22" height="22"','width="30" height="30"')+'<h3>Sin resultados</h3><p>No hay personal que coincida con el filtro, o todavía no has importado tu nómina.</p></div>';
  } else {
    html += '<div class="card" style="padding:4px 12px">' + personas.map(personaRowHTML).join('') + '</div>';
  }
  return html;
}

function personaRowHTML(p){
  var activo = Number(p.activo)===1;
  var abierto = turnoAbiertoDe(p.id);
  var expandido = state.ui.adminExpandido === ('p:'+p.id);
  var html = '<div class="list-row" data-action="expandir-persona" data-id="'+p.id+'">' +
    '<div class="avatar">'+esc(iniciales(p.nombre))+'</div>' +
    '<div class="info">' +
      '<div class="name">'+esc(p.nombre)+'</div>' +
      '<div class="meta">'+esc(p.rut)+(p.cargo?' &middot; '+esc(p.cargo):'')+' &middot; '+esc(nombreInstalacion(p.instalacionId))+'</div>' +
    '</div>' +
    (activo ? (abierto?'<span class="badge badge-ok">En turno</span>':'<span class="badge badge-off">Activo</span>') : '<span class="badge badge-warn">De baja</span>') +
    '<span style="color:var(--text-faint)">'+ICON.chevron+'</span>' +
  '</div>';
  if(expandido){
    html += '<div style="padding:0 4px 14px; display:flex; gap:8px; flex-wrap:wrap">' +
      (activo
        ? '<button class="btn btn-outline btn-sm" data-action="dar-de-baja" data-id="'+p.id+'">Dar de baja</button>'
        : '<button class="btn btn-outline btn-sm" data-action="reactivar" data-id="'+p.id+'">Reactivar</button>') +
      '<button class="btn btn-danger-ghost btn-sm" data-action="eliminar-persona" data-id="'+p.id+'">'+ICON.trash+' Eliminar</button>' +
    '</div>';
  }
  return html;
}

/* ==================================================================
   PANTALLA: INSTALACIONES
   ================================================================== */
function pantallaInstalaciones(){
  var lista = state.facilities.slice().sort(function(a,b){ return String(a.nombre).localeCompare(String(b.nombre),'es'); });
  var html = '<button class="btn btn-primary btn-sm" data-action="abrir-agregar-instalacion" style="width:100%; margin-bottom:14px">'+ICON.plus.replace('currentColor','#fff')+' Agregar instalaci&oacute;n</button>';
  if(!lista.length){
    html += '<div class="empty">'+ICON.building.replace('width="22" height="22"','width="30" height="30"')+'<h3>Sin instalaciones</h3><p>Agrega tu primer sitio de trabajo, o importa tu n&oacute;mina desde la pesta&ntilde;a Personal y se crear&aacute;n autom&aacute;ticamente.</p></div>';
  } else {
    html += '<div class="card" style="padding:4px 12px">' + lista.map(instalacionRowHTML).join('') + '</div>';
  }
  return html;
}

function instalacionRowHTML(f){
  var sinGPS = Number(f.geocercada)===1 && (f.lat==='' || f.lat===null || f.lng==='' || f.lng===null);
  var cantidad = state.people.filter(function(p){ return p.instalacionId===f.id && Number(p.activo)===1; }).length;
  return '<div class="list-row" data-action="abrir-editar-instalacion" data-id="'+f.id+'">' +
    '<div class="avatar">'+ICON.building.replace('width="22" height="22"','width="17" height="17"').replace('currentColor','#fff')+'</div>' +
    '<div class="info"><div class="name">'+esc(f.nombre)+'</div>' +
      '<div class="meta">'+cantidad+' persona'+(cantidad===1?'':'s')+' activa'+(cantidad===1?'':'s')+(Number(f.geocercada)===0?' &middot; sin geocerca':' &middot; radio '+f.radio+' m')+'</div>' +
    '</div>' +
    (sinGPS?'<span class="badge badge-warn">'+ICON.warn+' Falta GPS</span>':'') +
    '<span style="color:var(--text-faint)">'+ICON.chevron+'</span>' +
  '</div>';
}
</script>
<script>
'use strict';

/* ==================================================================
   PANTALLA: HISTORIAL
   ================================================================== */
function pantallaHistorial(){
  var instalaciones = state.facilities.slice().sort(function(a,b){ return String(a.nombre).localeCompare(String(b.nombre),'es'); });
  var desde = state.ui.historialDesde, hasta = state.ui.historialHasta;
  var instId = state.ui.historialInstalacion;

  var filas = state.shifts.filter(function(s){
    if(instId && s.instalacionId!==instId) return false;
    var f = s.entrada ? String(s.entrada).slice(0,10) : '';
    if(desde && f<desde) return false;
    if(hasta && f>hasta) return false;
    return true;
  }).sort(function(a,b){ return new Date(b.entrada) - new Date(a.entrada); });

  var html = '';
  html += '<div class="card" style="margin-bottom:14px">' +
    '<div class="field"><label>Instalaci&oacute;n</label><select data-action="filtrar-historial-instalacion"><option value="">Todas</option>' +
      instalaciones.map(function(f){ return '<option value="'+f.id+'"'+(instId===f.id?' selected':'')+'>'+esc(f.nombre)+'</option>'; }).join('') +
    '</select></div>' +
    '<div class="row2">' +
      '<div class="field"><label>Desde</label><input type="date" value="'+esc(desde)+'" data-action="filtrar-historial-desde"></div>' +
      '<div class="field"><label>Hasta</label><input type="date" value="'+esc(hasta)+'" data-action="filtrar-historial-hasta"></div>' +
    '</div>' +
  '</div>';

  html += '<div class="row2" style="margin-bottom:14px">' +
    '<button class="btn btn-primary btn-sm" data-action="exportar-excel">'+ICON.download.replace('currentColor','#fff')+' Exportar a Excel</button>' +
    '<button class="btn btn-outline btn-sm" data-action="exportar-csv">'+ICON.download+' Exportar CSV</button>' +
  '</div>';

  if(!filas.length){
    html += '<div class="empty">'+ICON.history.replace('width="22" height="22"','width="30" height="30"')+'<h3>Sin marcaciones</h3><p>No hay registros para el filtro seleccionado.</p></div>';
  } else {
    html += '<div class="table-wrap"><table><thead><tr><th>Instalaci&oacute;n</th><th>Nombre</th><th>RUT</th><th>Entrada</th><th>Salida</th><th>Distancia</th><th>Precisi&oacute;n</th></tr></thead><tbody>' +
      filas.map(historialRowHTML).join('') +
    '</tbody></table></div>';
    html += '<p style="text-align:center; font-size:12px; color:var(--text-faint); margin-top:10px">' + filas.length + ' ' + (filas.length===1 ? 'marcaci&oacute;n encontrada' : 'marcaciones encontradas') + '</p>';
  }
  return html;
}

function historialRowHTML(s){
  var persona = personaPorId(s.personId);
  return '<tr>' +
    '<td>'+esc(nombreInstalacion(s.instalacionId))+'</td>' +
    '<td>'+esc(persona?persona.nombre:nombrePersona(s.personId))+'</td>' +
    '<td>'+esc(persona?persona.rut:'')+'</td>' +
    '<td class="numeric">'+fmtFechaHora(s.entrada)+'</td>' +
    '<td class="numeric">'+(s.salida?fmtFechaHora(s.salida):'<span class="badge badge-ok" style="font-size:10px">En turno</span>')+'</td>' +
    '<td class="numeric">'+(s.distanciaEntrada!==''&&s.distanciaEntrada!=null?Math.round(s.distanciaEntrada)+' m':'&mdash;')+'</td>' +
    '<td class="numeric">'+(s.precisionEntrada!==''&&s.precisionEntrada!=null?'&plusmn;'+Math.round(s.precisionEntrada)+' m':'&mdash;')+'</td>' +
  '</tr>';
}
</script>
<script>
'use strict';

/* ==================================================================
   MODAL: CONFIGURACIÓN

function abrirModalConfig(){

      '<button class="sheet-close" data-action="cerrar-modal">'+ICON.x+'</button></div>' +

  );

function accionProbarConexion(){
  var url = document.getElementById('cfg-url').value.trim();
  var resultado = document.getElementById('cfg-resultado');
  if(!url){ resultado.innerHTML = '<div class="helper-banner danger">'+ICON.warn+'<span>Pega primero la URL.</span></div>'; return; }
  resultado.innerHTML = '<div class="helper-banner">'+'<span class="spinner dark"></span>'+'<span>Probando conexi&oacute;n&hellip;</span></div>';
  var probarUrl = url + (url.indexOf('?')>-1?'&':'?') + 't=' + Date.now();
  fetch(probarUrl).then(function(res){ return res.json(); }).then(function(data){
    if(data.ok){
      resultado.innerHTML = '<div class="helper-banner" style="background:var(--teal-soft); color:var(--teal)">'+ICON.check+'<span>Conexi&oacute;n exitosa &mdash; '+ (data.facilities||[]).length +' instalaciones, '+ (data.people||[]).length +' personas encontradas.</span></div>';
    } else {
      resultado.innerHTML = '<div class="helper-banner danger">'+ICON.warn+'<span>'+esc(data.error||'La hoja respondi&oacute; con un error.')+'</span></div>';
    }
  }).catch(function(){
    resultado.innerHTML = '<div class="helper-banner danger">'+ICON.warn+'<span>No se pudo conectar. Revisa la URL y que la implementaci&oacute;n tenga acceso "Cualquier usuario".</span></div>';
  });
}

function accionGuardarConfig(){
  var url = document.getElementById('cfg-url').value.trim();
  var pin = document.getElementById('cfg-pin').value.trim();

  guardarConfig(state.config);
  cerrarModal();
  renderApp();
  if(tieneBackend()){
    sincronizar(true).then(function(){ toast('Conectado correctamente', 'ok'); });
  }
}

    '<div class="hint" id="per-rut-hint">&nbsp;</div></div>';

  html += '<div class="row2">' +
    '<div class="field"><label>Cargo</label><input type="text" id="per-cargo" placeholder="Ej: Aseador" value="'+esc(persona&&persona.cargo?persona.cargo:'')+'" maxlength="100"></div>' +

function accionGuardarPersona(idExistente){

<script>
'use strict';

/* ==================================================================
   IMPORTAR PERSONAL DESDE EXCEL
   ================================================================== */
function normaliza(s){
  return String(s==null?'':s).toLowerCase().trim()
    .replace(/á/g,'a').replace(/é/g,'e').replace(/í/g,'i').replace(/ó/g,'o').replace(/ú/g,'u').replace(/ñ/g,'n');
}

var ALIAS_COLUMNAS = {
  instalacion: ['instalacion','trabajo - nombre sub-area asignada(o)','trabajo - nombre sub-area asignada','sub-area','sub area','sede','sitio'],
  nombre: ['nombre completo','nombre','empleado - nombre completo'],
  rut: ['rut','empleado - numero de documento','documento','numero de documento'],
  cargo: ['cargo','trabajo - cargo'],
  empresa: ['empresa','empresa - nombre empresa'],
  fechaIngreso: ['fecha ingreso','fecha de ingreso','liquidacion - fecha inicio'],
  estado: ['estado','empleado - estado'],
  fechaTermino: ['trabajo - fecha termino trabajo','fecha termino','fecha termino trabajo']
};

function detectarEncabezados(filasCrudas){
  var limite = Math.min(15, filasCrudas.length);
  for(var r=0; r<limite; r++){
    var fila = (filasCrudas[r]||[]).map(normaliza);
    var mapa = {};
    Object.keys(ALIAS_COLUMNAS).forEach(function(campo){
      for(var a=0; a<ALIAS_COLUMNAS[campo].length; a++){
        var idx = fila.indexOf(ALIAS_COLUMNAS[campo][a]);
        if(idx>-1){ mapa[campo]=idx; break; }
      }
    });
    if(mapa.nombre!==undefined && mapa.rut!==undefined && mapa.instalacion!==undefined){
      return {filaIndice:r, mapa:mapa};
    }
  }
  return null;
}

function valorFecha(v){
  if(!v) return '';
  if(v instanceof Date && !isNaN(v)) return v.toISOString().slice(0,10);
  return '';
}

function construirItemsDesdeArchivo(filasCrudas){
  var deteccion = detectarEncabezados(filasCrudas);
  if(!deteccion){
    return {error:'No se reconocieron las columnas del archivo. Debe tener al menos Instalaci\u00f3n, Nombre completo y RUT (o usar la planilla que te entregamos).'};
  }
  var mapa = deteccion.mapa;
  var items = [];
  for(var r=deteccion.filaIndice+1; r<filasCrudas.length; r++){
    var fila = filasCrudas[r] || [];
    var vacia = fila.every(function(c){ return c===''||c==null; });
    if(vacia) continue;
    var val = function(campo){ return mapa[campo]!==undefined ? fila[mapa[campo]] : ''; };
    var estado = String(val('estado')||'').trim();
    var fechaTermino = val('fechaTermino');
    var activo = true;
    if(estado && normaliza(estado)!=='activo') activo = false;
    if(fechaTermino) activo = false;
    var rut = String(val('rut')||'').trim();
    var nombre = String(val('nombre')||'').trim();
    var instalacion = String(val('instalacion')||'').trim();
    if(!rut && !nombre && !instalacion) continue;
    items.push({
      instalacion: instalacion,
      nombre: nombre,
      rut: rut,
      cargo: String(val('cargo')||'').trim(),
      empresa: String(val('empresa')||'').trim(),
      fechaIngreso: valorFecha(val('fechaIngreso')),
      activo: activo
    });
  }
  return {items: items};
}

function abrirModalImportar(){
  var html = '<div class="sheet-head"><div><h2>Importar personal desde Excel</h2>' +
    '<p>Acepta tu planilla de n\u00f3mina tal como la exportas, o una planilla simple con columnas Instalaci\u00f3n, Nombre completo, RUT, Cargo y Empresa.</p></div>' +
    '<button class="sheet-close" data-action="cerrar-modal">'+ICON.x+'</button></div>';
  html += '<div class="field"><label>Archivo (.xlsx, .xls o .csv)</label><input type="file" id="imp-archivo" accept=".xlsx,.xls,.csv"></div>';
  html += '<div id="imp-resultado"></div>';
  html += '<div class="sheet-actions"><button class="btn btn-outline" data-action="cerrar-modal">Cancelar</button></div>';
  abrirSheet(html);
}

function manejarArchivoImportar(file){
  var resultado = document.getElementById('imp-resultado');
  resultado.innerHTML = '<div class="helper-banner"><span class="spinner dark"></span><span>Leyendo archivo\u2026</span></div>';
  var lector = new FileReader();
  lector.onload = function(e){
    try{
      var datos = new Uint8Array(e.target.result);
      var libro = XLSX.read(datos, {type:'array', cellDates:true});
      var hoja = libro.Sheets[libro.SheetNames[0]];
      var filasCrudas = XLSX.utils.sheet_to_json(hoja, {header:1, defval:'', raw:true});
      var res = construirItemsDesdeArchivo(filasCrudas);
      if(res.error){ resultado.innerHTML = errorBanner(res.error); return; }
      mostrarPreviaImportacion(res.items);
    }catch(err){
      resultado.innerHTML = errorBanner('No se pudo leer el archivo: ' + err.message);
    }
  };
  lector.onerror = function(){ resultado.innerHTML = errorBanner('No se pudo leer el archivo.'); };
  lector.readAsArrayBuffer(file);
}

function mostrarPreviaImportacion(items){
  var resultado = document.getElementById('imp-resultado');
  window.__importItems = items;
  var validos = items.filter(function(it){ return it.nombre && validaRut(it.rut) && it.instalacion; });
  var invalidos = items.length - validos.length;
  var instalacionesNuevas = {};
  validos.forEach(function(it){
    var clave = it.instalacion.toLowerCase();
    var existe = state.facilities.some(function(f){ return f.nombre.toLowerCase()===clave; });
    if(!existe) instalacionesNuevas[clave] = it.instalacion;
  });
  var nuevasLista = Object.keys(instalacionesNuevas).map(function(k){ return instalacionesNuevas[k]; });

  var html = '<div class="helper-banner" style="background:var(--teal-soft); color:var(--teal)">'+ICON.check+
    '<span>Se detectaron <b>'+validos.length+'</b> personas listas para importar' + (invalidos?(' &mdash; '+invalidos+' fila(s) se omitir\u00e1n por datos incompletos o RUT inv\u00e1lido'):'') + '.</span></div>';
  if(nuevasLista.length){
    html += '<div class="helper-banner">'+ICON.warn+'<span>Se crear\u00e1n '+nuevasLista.length+' instalaciones nuevas: '+esc(nuevasLista.join(', '))+'. Deber\u00e1s configurarles la ubicaci\u00f3n GPS despu\u00e9s en la pesta\u00f1a Instalaciones.</span></div>';
  }
  html += '<div class="sheet-actions"><button class="btn btn-outline" data-action="cerrar-modal">Cancelar</button>' +
    '<button class="btn btn-primary" data-action="confirmar-importar" '+(validos.length?'':'disabled')+'>Importar '+validos.length+'</button></div>';
  resultado.innerHTML = html;
}

function accionConfirmarImportar(){
  var items = (window.__importItems||[]).filter(function(it){ return it.nombre && validaRut(it.rut) && it.instalacion; });
  if(!items.length) return;
  var btn = document.querySelector('[data-action="confirmar-importar"]');
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner" style="border-color:rgba(20,36,51,.3);border-top-color:var(--ink)"></span> Importando\u2026'; }
  apiPost({action:'importPeople', items:items}).then(function(resultado){
    cerrarModal();
    var msg = resultado.creadas+' creadas, '+resultado.actualizadas+' actualizadas';
    if(resultado.instalacionesCreadas) msg += ', '+resultado.instalacionesCreadas+' instalaciones nuevas';
    if(resultado.errores && resultado.errores.length) msg += '. '+resultado.errores.length+' fila(s) con error.';
    toast(msg, resultado.errores && resultado.errores.length ? 'error' : 'ok');
    if(resultado.errores && resultado.errores.length) console.warn('Errores de importaci\u00f3n:', resultado.errores);
    return sincronizar(false);
  }).then(function(){ renderMain(); })
  .catch(function(err){ toast(err.message, 'error'); });
}
</script>
<script>
'use strict';

/* ==================================================================
   EXPORTAR HISTORIAL
   ================================================================== */
function filasHistorialFiltradas(){
  var instId = state.ui.historialInstalacion, desde = state.ui.historialDesde, hasta = state.ui.historialHasta;
  return state.shifts.filter(function(s){
    if(instId && s.instalacionId!==instId) return false;
    var f = s.entrada ? String(s.entrada).slice(0,10) : '';
    if(desde && f<desde) return false;
    if(hasta && f>hasta) return false;
    return true;
  }).sort(function(a,b){ return new Date(a.entrada) - new Date(b.entrada); });
}

function filaExportable(s){
  var p = personaPorId(s.personId);
  return {
    'Instalaci\u00f3n': nombreInstalacion(s.instalacionId),
    'Nombre completo': p?p.nombre:nombrePersona(s.personId),
    'RUT': p?p.rut:'',
    'Cargo': p&&p.cargo?p.cargo:'',
    'Entrada': fmtFechaHora(s.entrada),
    'Salida': s.salida?fmtFechaHora(s.salida):'',
    'Distancia entrada (m)': s.distanciaEntrada!==''&&s.distanciaEntrada!=null?Math.round(s.distanciaEntrada):'',
    'Precisi\u00f3n GPS entrada (m)': s.precisionEntrada!==''&&s.precisionEntrada!=null?Math.round(s.precisionEntrada):''
  };
}

function accionExportarExcel(){
  var filas = filasHistorialFiltradas();
  if(!filas.length){ toast('No hay marcaciones para exportar con este filtro.', 'error'); return; }
  var hoja = XLSX.utils.json_to_sheet(filas.map(filaExportable));
  hoja['!cols'] = [{wch:22},{wch:28},{wch:14},{wch:20},{wch:18},{wch:18},{wch:16},{wch:18}];
  var libro = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(libro, hoja, 'Marcaciones');
  XLSX.writeFile(libro, 'marcaciones_' + state.ui.historialDesde + '_a_' + state.ui.historialHasta + '.xlsx');
}

function accionExportarCsv(){
  var filas = filasHistorialFiltradas();
  if(!filas.length){ toast('No hay marcaciones para exportar con este filtro.', 'error'); return; }
  var objetos = filas.map(filaExportable);
  var encabezados = Object.keys(objetos[0]);
  var lineas = [encabezados.join(';')];
  objetos.forEach(function(obj){
    var fila = encabezados.map(function(k){
      var v = String(obj[k]==null?'':obj[k]);
      return /[;"\n]/.test(v) ? '"'+v.replace(/"/g,'""')+'"' : v;
    });
    lineas.push(fila.join(';'));
  });
  var blob = new Blob(['\uFEFF'+lineas.join('\r\n')], {type:'text/csv;charset=utf-8'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url; a.download = 'marcaciones_' + state.ui.historialDesde + '_a_' + state.ui.historialHasta + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
}

/* ==================================================================
   MARCAR ENTRADA / SALIDA
   ================================================================== */
function accionMarcarEntrada(){
  if(!state.ui.personId) return;
  state.ui.marcando = true; renderMain();
  obtenerUbicacion().then(function(g){
    return apiPost({action:'entry', personId:state.ui.personId, lat:g.lat, lng:g.lng, accuracy:g.accuracy, timestamp:g.timestamp});
  }).then(function(){
    toast('Entrada registrada', 'ok');
    return sincronizar(false);
  }).then(function(){
    state.ui.marcando = false; renderMain();
  }).catch(function(err){
    state.ui.marcando = false; renderMain();
    toast(err.message, 'error');
  });
}

function accionMarcarSalida(){
  if(!state.ui.personId) return;
  state.ui.marcando = true; renderMain();
  obtenerUbicacion().then(function(g){
    return apiPost({action:'exit', personId:state.ui.personId, lat:g.lat, lng:g.lng, accuracy:g.accuracy});
  }).then(function(){
    toast('Salida registrada', 'ok');
    return sincronizar(false);
  }).then(function(){
    state.ui.marcando = false; renderMain();
  }).catch(function(err){
    state.ui.marcando = false; renderMain();
    toast(err.message, 'error');
  });
}
</script>
<script>
'use strict';

/* ==================================================================
   EVENTOS (delegados a nivel de documento — se registran una sola vez)
   ================================================================== */
function manejarClick(e){
  if(e.target.classList && e.target.classList.contains('overlay')){ cerrarModal(); return; }
  var el = e.target.closest('[data-action]');
  if(!el) return;
  var accion = el.getAttribute('data-action');
  var id = el.getAttribute('data-id');

  switch(accion){
    case 'tab': cambiarTab(el.getAttribute('data-tab')); break;
    case 'refrescar': sincronizar(true).then(function(){ renderMain(); toast('Datos actualizados','ok'); }); break;
    case 'config': abrirModalConfig(); break;
    case 'cerrar-modal': cerrarModal(); break;
    case 'confirmar-accion':
      var accionPendiente = window.__confirmAccion;
      cerrarModal();
      window.__confirmAccion = null;
      if(typeof accionPendiente==='function') accionPendiente();
      break;
    case 'probar-conexion': accionProbarConexion(); break;
    case 'guardar-config': accionGuardarConfig(); break;

    case 'marcar-entrada': accionMarcarEntrada(); break;
    case 'marcar-salida': accionMarcarSalida(); break;

    case 'abrir-agregar-persona': abrirModalPersona(null); break;
    case 'guardar-persona': accionGuardarPersona(id||null); break;
    case 'expandir-persona':
      state.ui.adminExpandido = state.ui.adminExpandido===('p:'+id) ? null : ('p:'+id);
      renderMain();
      break;
    case 'dar-de-baja': accionCambiarActivo(id, false); break;
    case 'reactivar': accionCambiarActivo(id, true); break;
    case 'eliminar-persona':
      var persona = personaPorId(id);
      abrirConfirmacion('Eliminar persona', '\u00bfSeguro que quieres eliminar a ' + (persona?persona.nombre:'esta persona') + '? Esta acci\u00f3n no se puede deshacer. Si tiene marcaciones registradas, el sistema no permitir\u00e1 eliminarla \u2014 dala de baja en ese caso.', 'Eliminar', function(){ accionEliminarPersona(id); });
      break;
    case 'filtrar-instalacion-personal': state.ui.personalInstalacion = id||''; renderMain(); break;
    case 'abrir-importar': abrirModalImportar(); break;
    case 'confirmar-importar': accionConfirmarImportar(); break;

    case 'abrir-agregar-instalacion': abrirModalInstalacion(null); break;
    case 'abrir-editar-instalacion': abrirModalInstalacion(id); break;
    case 'guardar-instalacion': accionGuardarInstalacion(id||null); break;
    case 'usar-ubicacion-actual': accionUsarUbicacionActual(); break;

    case 'exportar-excel': accionExportarExcel(); break;
    case 'exportar-csv': accionExportarCsv(); break;
  }
}

function manejarCambio(e){
  var el = e.target;
  if(el.id==='ins-geocercada'){
    var campos = document.getElementById('ins-gps-campos');
    if(campos) campos.style.display = el.checked ? '' : 'none';
    return;
  }
  if(el.id==='imp-archivo'){
    if(el.files && el.files[0]) manejarArchivoImportar(el.files[0]);
    return;
  }
  var accion = el.getAttribute && el.getAttribute('data-action');
  if(!accion) return;
  switch(accion){
    case 'cambiar-instalacion':
      state.ui.facilityId = el.value; state.ui.personId = '';
      guardarUltimos({facilityId: el.value, personId: ''});
      renderMain();
      break;
    case 'cambiar-persona':
      state.ui.personId = el.value;
      guardarUltimos({personId: el.value});
      renderMain();
      break;
    case 'filtrar-historial-instalacion': state.ui.historialInstalacion = el.value; renderMain(); break;
    case 'filtrar-historial-desde': state.ui.historialDesde = el.value; renderMain(); break;
    case 'filtrar-historial-hasta': state.ui.historialHasta = el.value; renderMain(); break;
  }
}

function manejarInput(e){
  var el = e.target;
  if(el.id==='per-rut'){ actualizarPistaRut(); return; }
  var accion = el.getAttribute && el.getAttribute('data-action');
  if(accion==='buscar-personal'){
    state.ui.personalFiltro = el.value;
    renderMain();
    var input = document.querySelector('[data-action="buscar-personal"]');
    if(input){ input.focus(); var v=input.value; input.value=''; input.value=v; }
  }
}

/* ==================================================================
   INICIO
   ================================================================== */
function init(){
  document.addEventListener('click', manejarClick);
  document.addEventListener('change', manejarCambio);
  document.addEventListener('input', manejarInput);
  window.addEventListener('online', function(){ state.online=true; if(tieneBackend()) sincronizar(false); });
  window.addEventListener('offline', function(){ state.online=false; renderTopbar(); });
  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState==='visible' && tieneBackend()) sincronizar(false).then(renderMain);
  });

  renderApp();
  if(tieneBackend()) sincronizar(true).then(function(){ renderMain(); });
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', init);
} else {
  init();
}
</script>
</body>
</html>
